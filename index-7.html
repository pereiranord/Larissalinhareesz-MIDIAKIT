<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Larissa Linhares — Media Kit</title>
<meta name="description" content="Media Kit de Larissa Linhares: audiência, alcance, conteúdos e formatos de parceria, com dados oficiais do Instagram.">
<meta name="theme-color" content="#F8F4EF">
<meta property="og:type" content="website">
<meta property="og:title" content="Larissa Linhares — Media Kit">
<meta property="og:description" content="Audiência, desempenho e conteúdos com dados oficiais do Instagram.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='32' fill='%23241A13'/%3E%3Ctext x='32' y='44' font-family='Georgia,serif' font-size='34' text-anchor='middle' fill='%23F8F4EF'%3EL%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..800;1,6..96,400..800&family=Geist:wght@300..800&display=swap" rel="stylesheet">
<style>
/* =========================================================
   TOKENS
   ========================================================= */
:root{
  --paper:#F8F4EF; --paper-2:#F2EBE2; --sand:#E7DACB; --sand-2:#D9C7B3;
  --taupe:#A68B70; --brown:#6E4E36; --espresso:#231911; --ink:#231911;
  --text:#3A2D23; --muted:#85745F; --footer:#EEE5D9;
  --green:#3F6A4B; --green-bg:rgba(80,130,95,.11);
  --red:#8A4B3A; --red-bg:rgba(160,85,60,.10);
  --hair:rgba(58,40,24,.10); --hair-2:rgba(58,40,24,.16);
  --serif:"Bodoni Moda","Didot",Georgia,serif;
  --sans:"Geist",-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
  --max:1180px; --pad:20px; --hdr-h:68px;
  --r-md:18px; --r-lg:24px; --r-xl:32px;
  --ease:cubic-bezier(.2,.7,.2,1);
  --shadow-lg:0 40px 80px -40px rgba(35,25,17,.45);
}
@media(min-width:768px){:root{--pad:32px}}
@media(min-width:1200px){:root{--pad:40px}}

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%;scroll-padding-top:calc(var(--hdr-h) + 12px)}
html.lock{overflow:hidden}
body{background:var(--paper);color:var(--text);font-family:var(--sans);font-size:16px;line-height:1.6;
  -webkit-font-smoothing:antialiased;overflow-x:hidden;text-rendering:optimizeLegibility}
img{display:block;max-width:100%}
a{color:inherit}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--brown);outline-offset:3px;border-radius:8px}
.wrap{max-width:var(--max);margin:0 auto;padding:0 var(--pad)}
.num{font-variant-numeric:tabular-nums lining-nums}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
svg.i{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}

.ambient{position:fixed;inset:0;z-index:-1;pointer-events:none;overflow:hidden}
.ambient i{position:absolute;border-radius:50%;filter:blur(40px)}
.ambient i:nth-child(1){width:720px;height:720px;top:-260px;right:-240px;background:radial-gradient(circle,rgba(217,199,179,.55),transparent 65%)}
.ambient i:nth-child(2){width:620px;height:620px;bottom:-220px;left:-260px;background:radial-gradient(circle,rgba(166,139,112,.20),transparent 65%)}

/* =========================================================
   TIPOGRAFIA
   ========================================================= */
section{position:relative;padding:76px 0}
@media(min-width:900px){section{padding:112px 0}}
.eyebrow{display:inline-flex;align-items:center;gap:12px;font-size:11.5px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;color:var(--brown)}
.eyebrow::before{content:"";width:28px;height:1px;background:currentColor;opacity:.55}
.h2{font-family:var(--serif);font-weight:500;color:var(--ink);font-size:clamp(34px,5.6vw,58px);line-height:1.04;letter-spacing:-.02em;margin-top:16px;max-width:14ch}
.h2 em{font-style:italic;font-weight:400;color:var(--brown)}
.lead{font-size:16.5px;line-height:1.65;color:var(--muted);max-width:52ch;margin-top:16px}
.sec-head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:20px 40px;margin-bottom:40px}
@media(min-width:900px){.sec-head{margin-bottom:56px}}

/* =========================================================
   BOTÕES
   ========================================================= */
.btn{--h:54px;position:relative;display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:var(--h);
  padding:0 26px;border-radius:999px;border:1px solid transparent;font-size:15px;font-weight:600;
  text-decoration:none;cursor:pointer;white-space:nowrap;-webkit-tap-highlight-color:transparent;
  transition:transform .25s var(--ease),background-color .25s,box-shadow .25s,border-color .25s,color .25s}
.btn svg.i{transition:transform .3s var(--ease)}
.btn:hover svg.i.arrow{transform:translateX(3px)}
.btn:active{transform:scale(.97)}
.btn-primary{background:var(--espresso);color:var(--paper);box-shadow:0 14px 30px -14px rgba(35,25,17,.6)}
.btn-primary:hover{background:#3A2A1E;transform:translateY(-1px)}
.btn-secondary{background:rgba(255,255,255,.7);border-color:var(--hair-2);color:var(--ink);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.btn-secondary:hover{background:#fff;border-color:rgba(58,40,24,.28)}
.btn-sm{--h:44px;padding:0 18px;font-size:14px}
.btn-light{background:var(--paper);color:var(--espresso)}
.btn-outline-light{background:transparent;color:var(--paper);border-color:rgba(248,244,239,.3)}
.btn-outline-light:hover{border-color:rgba(248,244,239,.7);background:rgba(248,244,239,.06)}
.btn-block{width:100%}

/* =========================================================
   VIDRO + SELOS
   ========================================================= */
.glass{position:relative;border-radius:var(--r-lg);
  background:linear-gradient(145deg,rgba(255,255,255,.78),rgba(255,255,255,.46));
  backdrop-filter:blur(22px) saturate(160%);-webkit-backdrop-filter:blur(22px) saturate(160%);
  border:1px solid rgba(255,255,255,.75);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.95),0 22px 44px -28px rgba(35,25,17,.32)}
.glass::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  background:linear-gradient(120deg,rgba(255,255,255,.55) 0%,rgba(255,255,255,0) 36%);opacity:.55}
.glass>*{position:relative}
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){.glass{background:rgba(255,255,255,.9)}}
.panel{border-radius:var(--r-lg);background:rgba(255,255,255,.5);border:1px solid var(--hair)}

.prov{display:inline-flex;align-items:center;gap:6px;font-size:10.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;
  padding:4px 9px;border-radius:999px;white-space:nowrap;line-height:1.3}
.prov::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.prov-official{color:var(--green);background:var(--green-bg)}
.prov-calc{color:var(--brown);background:rgba(110,78,54,.09)}
.prov-informed{color:#7A6450;background:rgba(166,139,112,.16)}

/* variação (seta) */
.delta{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:600;padding:5px 10px;border-radius:999px;white-space:nowrap}
.delta svg.i{width:14px;height:14px;stroke-width:2.2}
.delta.up{color:var(--green);background:var(--green-bg)}
.delta.down{color:var(--red);background:var(--red-bg)}
.delta.flat{color:var(--muted);background:rgba(35,25,17,.05)}

/* =========================================================
   HEADER
   ========================================================= */
.hdr{position:fixed;top:0;left:0;right:0;z-index:50;height:calc(var(--hdr-h) + env(safe-area-inset-top));padding-top:env(safe-area-inset-top);
  border-bottom:1px solid transparent;transition:background-color .4s,border-color .4s,box-shadow .4s}
.hdr.scrolled,.hdr.menu-open{background:rgba(248,244,239,.74);backdrop-filter:blur(20px) saturate(170%);-webkit-backdrop-filter:blur(20px) saturate(170%);
  border-bottom-color:rgba(58,40,24,.08);box-shadow:0 10px 30px -22px rgba(35,25,17,.35)}
.hdr-in{max-width:var(--max);height:var(--hdr-h);margin:0 auto;padding:0 var(--pad);display:flex;align-items:center;gap:28px}
.logo{display:flex;flex-direction:column;justify-content:center;text-decoration:none;color:var(--ink);line-height:1}
.logo-name{font-family:var(--serif);font-size:21px;font-weight:600;letter-spacing:-.01em}
.logo-tag{font-size:9.5px;font-weight:600;letter-spacing:.26em;text-transform:uppercase;color:var(--muted);margin-top:6px}
.hdr-nav{display:none;margin-left:auto;align-items:center;gap:2px}
.hdr-nav a{font-size:14px;font-weight:500;color:var(--text);text-decoration:none;padding:9px 14px;border-radius:999px;transition:background-color .25s,color .25s}
.hdr-nav a:hover{background:rgba(35,25,17,.05)}
.hdr-nav a.active{color:var(--ink);background:rgba(35,25,17,.07)}
.hdr-acts{display:none;align-items:center;gap:8px}
.menu-btn{margin-left:auto;position:relative;width:44px;height:44px;border:0;background:transparent;cursor:pointer;border-radius:12px}
.menu-btn span{position:absolute;left:11px;width:22px;height:1.6px;border-radius:2px;background:var(--ink);transition:transform .4s var(--ease),top .4s var(--ease)}
.menu-btn span:nth-child(1){top:17px}.menu-btn span:nth-child(2){top:25px}
.menu-btn[aria-expanded="true"] span:nth-child(1){top:21px;transform:rotate(45deg)}
.menu-btn[aria-expanded="true"] span:nth-child(2){top:21px;transform:rotate(-45deg)}
@media(min-width:960px){.hdr-nav{display:flex}.hdr-acts{display:flex}.menu-btn{display:none}}

.sheet{position:fixed;inset:0;z-index:45;display:flex;flex-direction:column;
  padding:calc(var(--hdr-h) + env(safe-area-inset-top) + 20px) var(--pad) calc(28px + env(safe-area-inset-bottom));
  background:rgba(248,244,239,.97);backdrop-filter:blur(28px);-webkit-backdrop-filter:blur(28px);
  opacity:0;visibility:hidden;transition:opacity .4s var(--ease),visibility .4s}
.sheet.open{opacity:1;visibility:visible}
.sheet nav{display:flex;flex-direction:column}
.sheet nav a{display:flex;align-items:baseline;gap:16px;padding:16px 2px;border-bottom:1px solid var(--hair);text-decoration:none;
  font-family:var(--serif);font-size:32px;font-weight:500;color:var(--ink);letter-spacing:-.015em;
  opacity:0;transform:translateY(14px);transition:opacity .45s var(--ease),transform .45s var(--ease)}
.sheet nav a small{font-family:var(--sans);font-size:11px;font-weight:600;letter-spacing:.14em;color:var(--taupe);width:22px}
.sheet.open nav a{opacity:1;transform:none;transition-delay:calc(var(--i) * 55ms + 90ms)}
.sheet-foot{margin-top:auto;display:grid;gap:10px}
.sheet-foot p{text-align:center;font-size:13px;color:var(--muted);margin-top:8px}
@media(min-width:960px){.sheet{display:none}}

/* =========================================================
   HERO
   ========================================================= */
.hero{padding:calc(var(--hdr-h) + env(safe-area-inset-top) + 20px) 0 56px}
.hero-grid{display:grid;gap:34px}
@media(min-width:960px){
  .hero{padding-bottom:90px}
  .hero-grid{grid-template-columns:1.08fr .92fr;gap:72px;align-items:center;min-height:calc(100svh - var(--hdr-h) - 80px)}
  .hero-media{order:2}
}
.hero-media{position:relative}
.hero-photo{position:relative;aspect-ratio:4/5;border-radius:var(--r-xl);overflow:hidden;background:var(--sand);box-shadow:var(--shadow-lg)}
.hero-photo img{width:100%;height:100%;object-fit:cover}
@media(max-width:959px){.hero-photo{aspect-ratio:auto;height:min(96vw,50svh)}}
.hero-photo::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(35,25,17,0) 60%,rgba(35,25,17,.28));pointer-events:none}
.hero-float{position:absolute;left:14px;bottom:14px;padding:16px 18px;border-radius:20px;min-width:188px}
@media(min-width:960px){.hero-float{left:-36px;bottom:40px;padding:20px 22px;min-width:220px}}
.hero-float .lbl{display:flex;align-items:center;gap:8px;font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.hero-float .val{font-size:34px;font-weight:600;letter-spacing:-.035em;color:var(--ink);line-height:1.1;margin-top:8px}
.hero-float .per{font-size:12px;color:var(--muted);margin-top:4px}
.hero h1{font-family:var(--serif);font-weight:500;color:var(--ink);font-size:clamp(50px,11vw,108px);line-height:.92;letter-spacing:-.03em}
.hero h1 em{display:block;font-style:italic;font-weight:400;color:var(--brown)}
.handle{display:inline-flex;align-items:center;gap:8px;margin-top:20px;font-size:15px;font-weight:500;text-decoration:none}
.handle:hover{color:var(--brown)}
.hero-meta{display:flex;flex-wrap:wrap;gap:6px 18px;margin-top:14px;font-size:12px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.hero-meta span{display:inline-flex;align-items:center;gap:7px}
.hero-lead{margin-top:22px;font-size:17px;line-height:1.65;color:var(--text);max-width:46ch;white-space:pre-line}
.hero-ctas{display:grid;gap:10px;margin-top:30px}
@media(min-width:480px){.hero-ctas{display:flex;flex-wrap:wrap;gap:12px}}
.hero-facts{display:grid;grid-template-columns:repeat(3,1fr);margin-top:38px;padding-top:24px;border-top:1px solid var(--hair)}
.hero-facts div{padding-right:10px}
.hero-facts div+div{padding-left:16px;border-left:1px solid var(--hair)}
.hero-facts b{display:block;font-size:24px;font-weight:600;letter-spacing:-.03em;color:var(--ink);line-height:1.1}
.hero-facts span{display:block;margin-top:6px;font-size:10.5px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
@media(min-width:960px){.hero-facts b{font-size:28px}}

.enter{opacity:0}
.is-ready .enter{animation:rise .9s var(--ease) both;animation-delay:var(--d,0ms)}
.is-ready .enter-photo{animation:photoIn 1.2s var(--ease) both}
@keyframes rise{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}
@keyframes photoIn{from{opacity:0;transform:scale(1.035)}to{opacity:1;transform:none}}

/* =========================================================
   FILTRO DE PERÍODO
   ========================================================= */
.period{display:flex;flex-wrap:wrap;align-items:center;gap:12px 16px;margin-bottom:28px}
.seg{display:flex;padding:4px;gap:2px;border-radius:999px;background:rgba(35,25,17,.055);overflow-x:auto;scrollbar-width:none;max-width:100%}
.seg::-webkit-scrollbar{display:none}
.seg button{flex:none;border:0;background:transparent;cursor:pointer;padding:9px 16px;border-radius:999px;font-size:13px;font-weight:600;color:var(--muted);
  transition:background-color .3s,color .3s,box-shadow .3s}
.seg button[aria-selected="true"]{background:#fff;color:var(--ink);box-shadow:0 6px 14px -8px rgba(35,25,17,.35)}
.period-note{font-size:12.5px;color:var(--muted)}

/* =========================================================
   BENTO DE MÉTRICAS
   ========================================================= */
.metrics-deco{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.metrics-deco i{position:absolute;border-radius:50%;filter:blur(10px)}
.metrics-deco i:nth-child(1){width:460px;height:460px;left:-120px;top:120px;background:radial-gradient(circle,rgba(217,199,179,.9),transparent 68%)}
.metrics-deco i:nth-child(2){width:380px;height:380px;right:-80px;top:260px;background:radial-gradient(circle,rgba(166,139,112,.38),transparent 68%)}

.bento{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media(min-width:900px){.bento{grid-template-columns:repeat(4,minmax(0,1fr));gap:18px}}
.kpi{display:flex;flex-direction:column;padding:20px 16px 18px;min-height:190px;transition:transform .4s var(--ease),box-shadow .4s var(--ease)}
@media(min-width:900px){.kpi{padding:26px 24px 22px;min-height:240px}}
@media(hover:hover){.kpi:hover{transform:translateY(-4px);box-shadow:inset 0 1px 0 rgba(255,255,255,.95),0 30px 56px -30px rgba(35,25,17,.42)}}
/* bloco herói do bento: alcance ocupa o dobro no desktop */
@media(min-width:900px){.kpi.lead-cell{grid-column:span 2}.kpi.lead-cell .kpi-value{font-size:clamp(48px,5.6vw,76px)}}
.kpi-label{display:flex;align-items:center;gap:8px;font-size:10.5px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.kpi-label svg.i{width:16px;height:16px;color:var(--brown)}
.kpi-value{margin-top:auto;padding-top:20px;font-size:clamp(34px,9.6vw,56px);font-weight:600;letter-spacing:-.045em;line-height:1;color:var(--ink);white-space:nowrap}
.kpi-meta{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;margin-top:10px;font-size:12px;color:var(--muted)}
.kpi-note{margin-top:14px;padding-top:12px;border-top:1px solid var(--hair);font-size:12.5px;line-height:1.45;color:var(--brown)}
.stat-row{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));margin-top:34px;border-top:1px solid var(--hair)}
.stat{padding:20px 0;border-bottom:1px solid var(--hair)}
.stat:nth-child(odd){padding-right:14px}.stat:nth-child(even){padding-left:16px;border-left:1px solid var(--hair)}
@media(min-width:900px){
  .stat-row{grid-template-columns:repeat(var(--n,5),minmax(0,1fr));border-bottom:1px solid var(--hair)}
  .stat{border-bottom:0;padding:24px 20px!important;border-left:1px solid var(--hair)}
  .stat:first-child{border-left:0;padding-left:0!important}
}
.stat b{display:block;font-size:26px;font-weight:600;letter-spacing:-.03em;color:var(--ink);line-height:1.1}
.stat span{display:block;margin-top:6px;font-size:10.5px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.stat small{display:block;margin-top:4px;font-size:12px;color:var(--muted)}

/* =========================================================
   LEITURA DOS DADOS
   ========================================================= */
.reading{display:grid;gap:12px;margin-top:40px}
@media(min-width:800px){.reading{grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}}
.read-card{display:flex;gap:16px;padding:24px 22px;border-radius:var(--r-lg);background:rgba(255,255,255,.5);border:1px solid var(--hair);
  transition:transform .4s var(--ease),border-color .4s}
@media(hover:hover){.read-card:hover{transform:translateY(-3px);border-color:rgba(58,40,24,.2)}}
.read-ic{width:42px;height:42px;flex:none;border-radius:13px;display:grid;place-items:center;background:rgba(110,78,54,.08);color:var(--brown)}
.read-card b{display:block;font-size:15.5px;font-weight:600;color:var(--ink);line-height:1.35}
.read-card p{margin-top:7px;font-size:14px;line-height:1.6;color:var(--muted)}

/* =========================================================
   DESEMPENHO
   ========================================================= */
.perf{padding:22px 18px}
@media(min-width:900px){.perf{padding:36px 40px}}
.perf-top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:14px 24px;margin-top:26px}
.perf-value{font-size:clamp(40px,8vw,60px);font-weight:600;letter-spacing:-.045em;line-height:1;color:var(--ink)}
.perf-sub{display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px;margin-top:10px;font-size:13px;color:var(--muted)}
.chart{position:relative;height:230px;margin-top:26px}
@media(min-width:900px){.chart{height:280px}}
.chart svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.chart .grid-line{stroke:rgba(58,40,24,.09);stroke-width:1}
.chart .axis{font-family:var(--sans);font-size:11px;fill:var(--muted)}
.chart .line{fill:none;stroke:var(--brown);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1;stroke-dashoffset:1;transition:stroke-dashoffset 1.5s var(--ease)}
.chart .area{opacity:0;transition:opacity 1s var(--ease) .5s}
.chart.drawn .line{stroke-dashoffset:0}.chart.drawn .area{opacity:1}
.chart .cursor{stroke:rgba(58,40,24,.25);stroke-width:1;stroke-dasharray:3 4}
.chart .cursor,.chart .cur-dot{opacity:0;transition:opacity .2s}
.chart.hover .cursor,.chart.hover .cur-dot{opacity:1}
.chart-tip{position:absolute;top:0;transform:translate(-50%,-110%);pointer-events:none;padding:8px 11px;border-radius:12px;
  background:var(--espresso);color:var(--paper);font-size:12px;white-space:nowrap;opacity:0;transition:opacity .2s}
.chart-tip b{display:block;font-size:14px;font-weight:600}
.perf-foot{display:flex;flex-wrap:wrap;gap:8px 20px;margin-top:22px;padding-top:18px;border-top:1px solid var(--hair);font-size:12.5px;color:var(--muted)}
.perf-foot span{display:inline-flex;align-items:center;gap:7px}
.perf-foot svg.i{width:15px;height:15px}
.collecting{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:10px;
  border:1px dashed rgba(58,40,24,.2);border-radius:var(--r-md);padding:24px}
.collecting b{font-family:var(--serif);font-size:24px;font-weight:500;color:var(--ink)}
.collecting p{font-size:14px;color:var(--muted);max-width:44ch}
.pulse{width:10px;height:10px;border-radius:50%;background:var(--brown);box-shadow:0 0 0 0 rgba(110,78,54,.4);animation:pulse 2s infinite}
@keyframes pulse{70%{box-shadow:0 0 0 12px rgba(110,78,54,0)}100%{box-shadow:0 0 0 0 rgba(110,78,54,0)}}

/* =========================================================
   AUDIÊNCIA
   ========================================================= */
.insights{display:grid;gap:10px}
@media(min-width:720px){.insights{grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}}
.insight{padding:24px 22px}
.insight .v{font-size:clamp(46px,11vw,64px);font-weight:600;letter-spacing:-.05em;line-height:1;color:var(--ink)}
.insight .v sup{font-size:.45em;font-weight:500;vertical-align:.9em;margin-left:2px;color:var(--brown)}
.insight .l{margin-top:12px;font-size:11px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--ink)}
.insight .f{margin-top:6px;font-size:12.5px;color:var(--muted);line-height:1.45}
.aud-grid{display:grid;gap:12px;margin-top:12px}
@media(min-width:900px){.aud-grid{grid-template-columns:5fr 7fr;gap:18px;margin-top:18px}}
.aud-card{padding:24px 20px}
@media(min-width:900px){.aud-card{padding:32px}}
.card-title{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:22px}
.card-title h3{font-size:11px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.donut-wrap{display:flex;align-items:center;gap:26px;flex-wrap:wrap}
.donut{position:relative;width:150px;height:150px;flex:none}
.donut svg{width:100%;height:100%;transform:rotate(-90deg)}
.donut circle{fill:none;stroke-width:14;transition:stroke-dasharray 1.4s var(--ease)}
.donut .c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.donut .c b{font-size:28px;font-weight:600;letter-spacing:-.04em;color:var(--ink);line-height:1}
.donut .c span{font-size:10px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-top:5px}
.legend{display:grid;gap:10px;font-size:14px}
.legend div{display:flex;align-items:center;gap:10px}
.legend i{width:10px;height:10px;border-radius:3px}
.legend b{margin-left:auto;padding-left:14px;font-weight:600;color:var(--ink)}
.cols{display:flex;align-items:flex-end;gap:8px;height:170px;margin-top:6px}
.col{flex:1;min-width:0;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:8px}
.col .bar-v{width:100%;max-width:46px;height:0;border-radius:10px 10px 4px 4px;background:var(--sand-2);transition:height 1.2s var(--ease);transition-delay:calc(var(--i) * 70ms)}
.col.top .bar-v{background:linear-gradient(180deg,var(--taupe),var(--brown))}
.col .pv{font-size:12px;font-weight:600;color:var(--ink)}
.col .pl{font-size:11px;color:var(--muted);white-space:nowrap}
.in .col .bar-v{height:var(--h)}
.rank{display:grid;gap:14px}
.rank-row{display:grid;grid-template-columns:24px minmax(0,1fr) 44px;align-items:center;gap:12px;font-size:14px}
.rank-row small{font-size:11px;font-weight:600;color:var(--taupe)}
.rank-row .nm{display:flex;flex-direction:column;gap:7px;min-width:0}
.rank-row .nm span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink);font-weight:500}
.rank-row b{text-align:right;font-weight:600;color:var(--ink)}
.track{height:6px;border-radius:999px;background:rgba(58,40,24,.08);overflow:hidden}
.track i{display:block;height:100%;width:0;border-radius:999px;background:linear-gradient(90deg,var(--taupe),var(--brown));transition:width 1.2s var(--ease);transition-delay:calc(var(--i) * 60ms)}
.in .track i{width:var(--w)}
.geo-cols{display:grid;gap:30px}
@media(min-width:640px){.geo-cols{grid-template-columns:1fr 1fr}}
.geo-cols h4{font-size:12px;font-weight:600;color:var(--ink);margin-bottom:16px}
.note{margin-top:22px;font-size:12px;color:var(--muted);line-height:1.5;display:flex;gap:8px}
.note svg.i{width:15px;height:15px;margin-top:1px}
.countries{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px}
.countries span{font-size:13px;padding:7px 12px;border-radius:999px;background:rgba(35,25,17,.045)}
.countries b{font-weight:600;color:var(--ink);margin-left:6px}

/* =========================================================
   CONTEÚDO
   ========================================================= */
.ig-bar{display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:22px}
.ig-bar img,.ig-bar .ph{width:52px;height:52px;border-radius:50%;object-fit:cover;background:var(--sand);flex:none;box-shadow:0 0 0 2px #fff,0 0 0 3px var(--sand-2)}
.ig-bar .who{min-width:0;flex:1}
.ig-bar .who b{display:block;font-weight:600;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ig-bar .who>span{display:block;font-size:13px;line-height:1.45;color:var(--muted)}
.ig-bar .who .nw{white-space:nowrap}
.ig-bar .btn{flex:none}
@media(max-width:420px){.ig-bar .btn span{display:none}.ig-bar .btn{padding:0 14px}}
.filters{display:flex;gap:8px;margin:18px 0;overflow-x:auto;scrollbar-width:none;padding:2px}
.filters::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--hair-2);background:rgba(255,255,255,.6);cursor:pointer;padding:9px 16px;border-radius:999px;font-size:13px;font-weight:600;color:var(--text);transition:background-color .25s,color .25s,border-color .25s}
.chip:hover{background:#fff}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.chip small{font-weight:500;opacity:.6;margin-left:4px}
.feed{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
@media(min-width:640px){.feed{grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}}
@media(min-width:1024px){.feed{gap:22px}}
.post{position:relative;display:block;width:100%;aspect-ratio:4/5;padding:0;border:0;cursor:pointer;text-align:left;
  border-radius:14px;overflow:hidden;background:var(--sand);transition:transform .4s var(--ease),box-shadow .4s var(--ease)}
@media(min-width:1024px){.post{border-radius:20px}}
.post:active{transform:scale(.985)}
@media(hover:hover){.post:hover{box-shadow:0 24px 44px -26px rgba(35,25,17,.55)}.post:hover img{transform:scale(1.045)}}
.post img{width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .7s var(--ease),transform 1s var(--ease)}
.post img.ok{opacity:1}
.post .ph-ic{position:absolute;inset:0;display:grid;place-items:center;color:var(--taupe)}
.post .ph-ic svg.i{width:28px;height:28px}
.post-type{position:absolute;top:8px;left:8px;display:inline-flex;align-items:center;gap:5px;padding:5px 9px;border-radius:999px;
  font-size:11px;font-weight:600;color:var(--ink);background:rgba(255,255,255,.78);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.post-type svg.i{width:13px;height:13px}
.post-shade{position:absolute;left:0;right:0;bottom:0;height:58%;background:linear-gradient(to top,rgba(20,14,10,.74),rgba(20,14,10,0));pointer-events:none}
.post-m{position:absolute;left:10px;right:10px;bottom:9px;display:flex;flex-wrap:wrap;gap:4px 11px;color:#fff;font-size:12px;font-weight:600}
.post-m span{display:inline-flex;align-items:center;gap:4px}
.post-m svg.i{width:14px;height:14px}
.post-m .post-x{display:none}
@media(hover:hover) and (min-width:1024px){
  .post-m{left:16px;right:16px;bottom:14px;font-size:13px;gap:6px 14px}
  .post-m .post-x{display:flex;gap:14px;width:100%;opacity:0;max-height:0;transform:translateY(6px);transition:opacity .35s,transform .35s var(--ease),max-height .35s}
  .post:hover .post-x{opacity:.9;max-height:24px;transform:none}
}
.feed-more{display:flex;flex-direction:column;align-items:center;gap:12px;margin-top:34px}
.empty{padding:40px 24px;text-align:center;color:var(--muted)}

.modal{position:fixed;inset:0;z-index:70;display:flex;align-items:flex-end;justify-content:center;visibility:hidden;opacity:0;transition:opacity .35s var(--ease),visibility .35s}
.modal.open{visibility:visible;opacity:1}
.modal-bg{position:absolute;inset:0;background:rgba(22,15,10,.55);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.modal-card{position:relative;width:100%;max-height:92svh;overflow-y:auto;overscroll-behavior:contain;background:var(--paper);
  border-radius:28px 28px 0 0;transform:translateY(40px);transition:transform .5s var(--ease);padding-bottom:env(safe-area-inset-bottom)}
.modal.open .modal-card{transform:none}
.modal-media{position:relative;background:#1B140F;aspect-ratio:4/5;max-height:56svh;width:100%}
.modal-media img{width:100%;height:100%;object-fit:contain}
.modal-body{padding:24px 20px 28px;display:flex;flex-direction:column;gap:20px}
.modal-close{position:absolute;top:12px;right:12px;z-index:3;width:42px;height:42px;border-radius:50%;border:1px solid rgba(255,255,255,.6);display:grid;place-items:center;cursor:pointer;
  background:rgba(255,255,255,.8);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);color:var(--ink)}
.modal-nav{position:absolute;top:50%;z-index:2;width:42px;height:42px;margin-top:-21px;border-radius:50%;border:0;display:grid;place-items:center;cursor:pointer;
  background:rgba(255,255,255,.78);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);color:var(--ink);transition:transform .25s var(--ease)}
.modal-nav:active{transform:scale(.92)}
.modal-nav.prev{left:12px}.modal-nav.next{right:12px}
.m-head{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;font-size:13px;color:var(--muted)}
.m-type{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--ink)}
.m-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1px;background:var(--hair);border:1px solid var(--hair);border-radius:18px;overflow:hidden}
.m-grid div{background:var(--paper);padding:15px 16px}
.m-grid div:last-child:nth-child(odd){grid-column:1/-1}
.m-grid span{display:block;font-size:10px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.m-grid b{display:block;margin-top:6px;font-size:24px;font-weight:600;letter-spacing:-.03em;color:var(--ink);line-height:1.1}
.m-cap{font-size:15px;line-height:1.65;color:var(--text);white-space:pre-line;overflow-wrap:anywhere}
.m-cap.clamp{display:-webkit-box;-webkit-line-clamp:6;-webkit-box-orient:vertical;overflow:hidden}
.m-more{align-self:flex-start;border:0;background:none;cursor:pointer;font-size:13px;font-weight:600;color:var(--brown);padding:0}
@media(min-width:860px){
  .modal{align-items:center;padding:28px}
  .modal-card{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);width:min(1040px,100%);max-height:calc(100svh - 56px);overflow:hidden;border-radius:28px;transform:translateY(16px) scale(.985)}
  .modal-media{aspect-ratio:auto;max-height:none;height:100%;min-height:560px}
  .modal-body{overflow-y:auto;padding:36px 34px}
}

/* =========================================================
   SOBRE / PARCERIAS / RODAPÉ
   ========================================================= */
.about{display:grid;gap:28px}
@media(min-width:900px){.about{grid-template-columns:1fr 1.1fr;gap:72px;align-items:start}}
.about blockquote{font-family:var(--serif);font-style:italic;font-weight:400;font-size:clamp(28px,4.4vw,44px);line-height:1.18;color:var(--ink);letter-spacing:-.015em}
.about p{font-size:17px;line-height:1.75;color:var(--text);white-space:pre-line}

.partner{position:relative;overflow:hidden;border-radius:var(--r-xl);background:var(--espresso);color:var(--paper);padding:52px 22px}
@media(min-width:900px){.partner{padding:88px 72px}}
.partner::before{content:"";position:absolute;width:640px;height:640px;right:-220px;top:-300px;border-radius:50%;background:radial-gradient(circle,rgba(185,151,110,.35),transparent 65%)}
.partner::after{content:"";position:absolute;width:520px;height:520px;left:-240px;bottom:-320px;border-radius:50%;background:radial-gradient(circle,rgba(166,139,112,.22),transparent 65%)}
.partner>*{position:relative}
.partner .eyebrow{color:#CBB396}
.partner .h2{color:var(--paper);max-width:18ch}
.partner .h2 em{color:#D9C2A3}
.partner .lead{color:rgba(248,244,239,.7)}
.fmts{display:grid;gap:10px;margin-top:40px}
@media(min-width:640px){.fmts{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(min-width:1100px){.fmts{grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}}
.fmt{padding:22px 20px;border-radius:20px;background:linear-gradient(145deg,rgba(255,255,255,.09),rgba(255,255,255,.03));border:1px solid rgba(255,255,255,.12);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);transition:transform .35s var(--ease),border-color .35s}
@media(hover:hover){.fmt:hover{transform:translateY(-3px);border-color:rgba(255,255,255,.24)}}
.fmt .ic{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;background:rgba(248,244,239,.08);color:#E6D3BA;margin-bottom:18px}
.fmt b{display:block;font-size:16px;font-weight:600;color:var(--paper)}
.fmt p{margin-top:6px;font-size:13.5px;line-height:1.5;color:rgba(248,244,239,.62)}
.partner-ctas{display:grid;gap:10px;margin-top:40px}
@media(min-width:480px){.partner-ctas{display:flex;flex-wrap:wrap;gap:12px}}

.fade-end{height:140px;background:linear-gradient(180deg,rgba(238,229,217,0),var(--footer));margin-top:-20px}
footer{background:var(--footer);padding:12px 0 calc(34px + env(safe-area-inset-bottom))}
.foot{display:grid;grid-template-columns:1fr 1fr;gap:36px 20px}
.foot-brand,.foot-cta{grid-column:1/-1}
@media(min-width:900px){.foot{grid-template-columns:1.5fr 1fr 1fr 1.3fr;gap:48px}.foot-brand,.foot-cta{grid-column:auto}}
.foot-brand .n{font-family:var(--serif);font-size:32px;font-weight:500;color:var(--ink);letter-spacing:-.02em;line-height:1}
.foot-brand .t{margin-top:10px;font-size:14px;color:var(--muted)}
.foot-brand .u{margin-top:18px;display:inline-flex;align-items:center;gap:8px;font-size:14px;font-weight:600;color:var(--ink);text-decoration:none}
.foot h4{font-size:10.5px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin-bottom:16px}
.foot ul{list-style:none;display:grid;gap:11px}
.foot ul a{font-size:14.5px;color:var(--text);text-decoration:none;display:inline-flex;align-items:center;gap:8px;transition:color .2s}
.foot ul a:hover{color:var(--brown)}
.foot-cta p{font-size:14.5px;color:var(--text);margin-bottom:16px;line-height:1.55}
.data-note{margin-top:48px;padding:20px;border-radius:20px;background:rgba(255,255,255,.45);border:1px solid var(--hair);font-size:12.5px;line-height:1.6;color:var(--muted)}
.data-note .row{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}
.foot-bottom{display:flex;flex-wrap:wrap;justify-content:space-between;gap:10px 24px;margin-top:28px;padding-top:22px;border-top:1px solid var(--hair);font-size:12.5px;color:var(--muted)}

.reveal{opacity:0;transform:translateY(20px);transition:opacity .8s var(--ease),transform .8s var(--ease);transition-delay:calc(var(--i,0) * 70ms)}
.reveal.in{opacity:1;transform:none}
.skel{background:linear-gradient(100deg,var(--paper-2) 30%,#fff 50%,var(--paper-2) 70%);background-size:300% 100%;animation:sh 1.6s linear infinite;border-radius:14px}
@keyframes sh{from{background-position:100% 0}to{background-position:-50% 0}}
.load-hero{padding:calc(var(--hdr-h) + 24px) 0 80px}
.load-grid{display:grid;gap:28px}
@media(min-width:960px){.load-grid{grid-template-columns:1.08fr .92fr;gap:72px;align-items:center;min-height:70vh}}
.err{padding:160px 20px;text-align:center}
.err b{display:block;font-family:var(--serif);font-size:30px;font-weight:500;color:var(--ink)}
.err p{margin:10px auto 24px;color:var(--muted);max-width:40ch}

@media (prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important;transition-delay:0ms!important}
  .reveal,.enter{opacity:1!important;transform:none!important}
}

/* =========================================================
   PDF — documento editorial.
   Formal no ritmo e na tipografia; a paleta da marca continua
   viva, para não virar relatório de banco.
   ========================================================= */
.pdf-only{display:none}
@media print{
  @page{size:A4;margin:16mm 15mm}
  html,body{background:#fff!important;font-size:10pt;color:#3A2D23!important}
  .ambient,.hdr,.sheet,.modal,.no-print,.period,.filters,.feed-more,.fade-end,
  .metrics-deco,.hero-ctas,.partner-ctas,.ig-bar,.handle,.delta,.chart-tip{display:none!important}
  .pdf-only{display:block}
  .wrap{max-width:none;padding:0}
  .reveal,.enter{opacity:1!important;transform:none!important}
  a{text-decoration:none!important;color:#3A2D23!important}

  /* superfícies: filete fino em vez de caixa pesada */
  .glass,.panel{background:transparent!important;border:0!important;border-top:.35mm solid #C9B9A6!important;
    border-radius:0!important;box-shadow:none!important;backdrop-filter:none!important}
  .glass::before{display:none}

  /* ---- capa ---- */
  .pdf-cover{display:flex!important;flex-direction:column;justify-content:center;min-height:243mm;break-after:page;text-align:center}
  .pdf-cover .eb{font-size:8.5pt;letter-spacing:.34em;text-transform:uppercase;color:#A68B70}
  .pdf-cover .nm{font-family:var(--serif);font-weight:400;font-size:44pt;line-height:1.02;color:#231911;margin-top:7mm}
  .pdf-cover .nm em{display:block;font-style:italic;color:#6E4E36}
  .pdf-cover .rule{width:26mm;height:.4mm;background:#A68B70;margin:9mm auto}
  .pdf-cover .sub{font-size:10.5pt;color:#85745F;line-height:1.8}
  .pdf-cover .figs{display:grid;grid-template-columns:repeat(3,1fr);gap:0;margin:16mm auto 0;max-width:140mm;
    border-top:.3mm solid #E0D5C6;border-bottom:.3mm solid #E0D5C6;padding:7mm 0}
  .pdf-cover .figs div+div{border-left:.3mm solid #E0D5C6}
  .pdf-cover .figs b{display:block;font-family:var(--serif);font-size:21pt;font-weight:500;color:#231911;line-height:1}
  .pdf-cover .figs span{display:block;margin-top:2.5mm;font-size:7.5pt;letter-spacing:.16em;text-transform:uppercase;color:#85745F}
  .pdf-cover .src{margin-top:14mm;font-size:8.5pt;color:#A68B70;font-style:italic}

  /* ---- ritmo das seções ---- */
  section{padding:0 0 11mm!important;break-inside:auto}
  section+section{padding-top:3mm!important}
  .sec-head{display:block!important;margin-bottom:6mm!important;padding-bottom:3mm;border-bottom:.3mm solid #E0D5C6;break-after:avoid}
  .eyebrow{font-size:8pt;letter-spacing:.26em;color:#A68B70}
  .eyebrow::before{display:none}
  .h2{font-size:19pt!important;margin-top:2.5mm!important;max-width:none}
  .lead{font-size:9.5pt;margin-top:2mm;max-width:none;color:#85745F}

  /* ---- abertura ---- */
  .hero{padding:0 0 10mm!important}
  .hero-grid{grid-template-columns:62mm 1fr!important;gap:10mm!important;min-height:0!important;align-items:start}
  .hero-media{order:0!important}
  .hero-photo{box-shadow:none!important;aspect-ratio:4/5!important;height:auto!important;border-radius:2mm!important}
  .hero-photo::after{display:none}
  .hero h1{font-size:26pt!important;line-height:1}
  .hero-lead{font-size:10pt!important;margin-top:4mm!important}
  .hero-meta{margin-top:3mm!important;font-size:8pt}
  .hero-facts{margin-top:6mm!important;padding-top:4mm!important;border-top:.3mm solid #E0D5C6}
  .hero-facts b{font-size:15pt!important}
  .hero-facts span{font-size:7.5pt}
  .hero-float{display:none!important}

  /* ---- números ---- */
  .bento{grid-template-columns:repeat(2,1fr)!important;gap:0!important;
    border-top:.3mm solid #E0D5C6;border-left:.3mm solid #E0D5C6}
  .kpi{min-height:0!important;padding:6mm!important;break-inside:avoid;
    border-right:.3mm solid #E0D5C6!important;border-bottom:.3mm solid #E0D5C6!important;border-top:0!important}
  .kpi.lead-cell{grid-column:span 2!important}
  .kpi.lead-cell .kpi-value{font-size:34pt!important}
  .kpi-label{font-size:7.5pt;letter-spacing:.16em}
  .kpi-label svg.i{width:3.4mm;height:3.4mm}

<script>
/* =========================================================================
   CONFIGURAÇÃO LOCAL

   backend, no bloco "about" — a Larissa edita pelo painel. O que fica
   aqui é só o fallback e o endereço da API.

const SITE = {
  API_BASE: "https://worker-larissalinhareesz-ofc.pereiranord-co.workers.dev",
  name: "Larissa Linhares",
  whatsappMessage: "Olá, Larissa! Vi seu Media Kit e gostaria de conversar sobre uma parceria.",
  formatsPadrao: [
    { icon: "reel",  title: "Reels",   text: "Vídeos verticais para o feed e a aba Reels." },
    { icon: "story", title: "Stories", text: "Sequências de 24 horas com link e chamada direta." },
    { icon: "post",  title: "Posts",   text: "Fotos e carrosséis permanentes no feed." },
    { icon: "ugc",   title: "UGC",     text: "Conteúdo produzido para os canais da sua marca." },
    { icon: "spark", title: "Campanhas personalizadas", text: "Formatos combinados, desenhados para o seu objetivo." }
  ],

/* ------------------------------------------------------------ utilitários */
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
const nf = new Intl.NumberFormat("pt-BR");
const MONTHS = ["jan","fev","mar","abr","mai","jun","jul","ago","set","out","nov","dez"];
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const has = v => v !== null && v !== undefined && !Number.isNaN(v);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
const img = p => !p ? "" : /^(https?:|data:)/.test(p) ? p : (p.startsWith("/") ? SITE.API_BASE + p : p);

function fmt(n) {
  if (!has(n)) return "—";
  const a = Math.abs(n);
  if (a >= 1e6) return (n / 1e6).toFixed(1).replace(".0", "").replace(".", ",") + "M";
  if (a >= 1e5) return Math.round(n / 1e3) + "K";
  return nf.format(Math.round(n));
}
const pct = (n, d = 1) => has(n) ? n.toFixed(d).replace(".", ",") + "%" : "—";
const fmtBy = (kind, n) => kind === "pct" ? pct(n) : fmt(n);
const dec = (n, d = 1) => has(n) ? n.toFixed(d).replace(".", ",") : "—";
const parseDay = d => new Date(d + "T12:00:00-03:00");
const dShort = d => { const x = parseDay(d); return String(x.getDate()).padStart(2, "0") + " " + MONTHS[x.getMonth()]; };
const dFull = iso => new Date(iso).toLocaleDateString("pt-BR", { timeZone: "America/Sao_Paulo" });
const dLong = iso => new Date(iso).toLocaleDateString("pt-BR", { day: "numeric", month: "long", year: "numeric", timeZone: "America/Sao_Paulo" });
const dTime = iso => new Date(iso).toLocaleString("pt-BR", { day: "2-digit", month: "2-digit", year: "numeric", hour: "2-digit", minute: "2-digit", timeZone: "America/Sao_Paulo" });

const P = {

  mail: '<rect x="3" y="5" width="18" height="14" rx="2.5"/><path d="M3.5 7l8.5 6 8.5-6"/>',
  users: '<circle cx="9" cy="8" r="3.4"/><path d="M2.8 20c.6-3.4 3.2-5.4 6.2-5.4s5.6 2 6.2 5.4M16 4.8a3.3 3.3 0 0 1 0 6.4M18.2 14.8c1.6.6 2.7 2.4 3 5.2"/>',

  heart: '<path d="M12 20s-7.5-4.6-9.2-9.3C1.6 7.3 3.8 4.5 7 4.5c2.1 0 3.7 1.2 5 3 1.3-1.8 2.9-3 5-3 3.2 0 5.4 2.8 4.2 6.2C19.5 15.4 12 20 12 20z"/>',

  pin: '<path d="M12 21s-7-5.6-7-11.2a7 7 0 1 1 14 0C19 15.4 12 21 12 21z"/><circle cx="12" cy="9.8" r="2.6"/>',
  info: '<circle cx="12" cy="12" r="9"/><path d="M12 11v5.5M12 7.6v.2"/>',

  target: '<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4.5"/><path d="M12 3v3M12 18v3M3 12h3M18 12h3"/>',
  download: '<path d="M12 3v12M7.5 10.5L12 15l4.5-4.5M4 20h16"/>',
  globe: '<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.7 2.5 15.3 0 18M12 3c-2.5 2.7-2.5 15.3 0 18"/>'
};
const ic = (n, cls = "") => `<svg class="i ${cls}" viewBox="0 0 24 24" aria-hidden="true">${P[n] || ""}</svg>`;
const provTag = t => ({
  official: '<span class="prov prov-official" title="Obtido pela API oficial do Instagram (Meta)">Oficial</span>',
  calc: '<span class="prov prov-calc" title="Calculado pelo Media Kit a partir de dados oficiais">Calculado</span>',
  informed: '<span class="prov prov-informed" title="Informado pela criadora">Informado</span>'
}[t] || "");

/* ------------------------------------------------------------------ estado */
const PERIODOS = [
  { key: "d1",  dias: 1,  label: "24h",     nome: "Últimas 24 horas" },
  { key: "d7",  dias: 7,  label: "7 dias",  nome: "Últimos 7 dias" },
  { key: "d14", dias: 14, label: "14 dias", nome: "Últimos 14 dias" },
  { key: "d28", dias: 28, label: "28 dias", nome: "Últimos 28 dias" }
];

const S = {
  d: null, user: "", media: [], filter: "all", showAll: false,
  metric: "followers", periodo: "d28", list: [], idx: 0,
  sid: Math.random().toString(36).slice(2) + Date.now().toString(36)
};

function about() { return (S.d && S.d.about) || {}; }

function contactHref() {
  const a = about();
  if (a.contact_whatsapp) return `https://wa.me/${String(a.contact_whatsapp).replace(/\D/g, "")}?text=${encodeURIComponent(SITE.whatsappMessage)}`;
  if (a.contact_email) return `mailto:${a.contact_email}?subject=${encodeURIComponent("Parceria — Media Kit")}`;
  return S.user ? `https://ig.me/m/${S.user}` : "#parcerias";
}
const igHref = () => S.user ? `https://www.instagram.com/${S.user}/` : "https://www.instagram.com/";

/* ======================================================================
   CÁLCULOS — tudo derivado de dado real. Quando o dado não existe, o
   bloco some; nada é estimado nem preenchido com suposição.
   ====================================================================== */
function janelaDe(key) {
  const j = (S.d && S.d.janelas) || {};
  if (j[key]) return j[key];
  // compatibilidade com a versão anterior do backend
  if (key === "d28" && S.d && S.d.kpis_28d) return S.d.kpis_28d;
  return null;
}

function periodosDisponiveis() {
  const disp = PERIODOS.filter(p => janelaDe(p.key));
  if (disp.length) return disp;
  // sem janelas: cai no snapshot do dia, como a versão antiga fazia
  return S.d && S.d.kpis ? [{ key: "dia", dias: 1, label: "24h", nome: "Últimas 24 horas" }] : [];
}

function kpisDoPeriodo() {
  const d = S.d, k = d.kpis || {};
  const followers = d.profile?.followers ?? k.followers ?? null;
  const p = PERIODOS.find(x => x.key === S.periodo);
  const w = janelaDe(S.periodo);

  let src;
  if (w) {
    src = {
      nome: p ? p.nome : "Período", dias: w.dias || (p && p.dias),
      reach: w.reach, views: w.views, inter: w.total_interactions,
      likes: w.likes, comments: w.comments, shares: w.shares, saves: w.saves,
      since: w.since, until: w.until
    };
  } else {
    src = {
      nome: "Últimas 24 horas", dias: 1,
      reach: k.reach, views: k.views, inter: k.interactions,
      likes: k.likes, comments: k.comments, shares: k.shares, saves: k.saves
    };
  }

  const eng = has(src.inter) && src.reach ? src.inter / src.reach * 100 : null;
  const freq = has(src.views) && src.reach ? src.views / src.reach : null;
  const reachRate = src.reach && followers ? src.reach / followers * 100 : null;
  return { followers, ...src, eng, freq, reachRate };
}

/* comparativo com a janela anterior (só existe para 28 dias) */
function comparativo() {
  if (S.periodo !== "d28") return null;
  const atual = janelaDe("d28"), ant = (S.d.janelas || {}).d28_anterior;
  if (!atual || !ant) return null;
  const varia = (a, b) => (has(a) && has(b) && b) ? (a - b) / Math.abs(b) * 100 : null;
  return {
    reach: varia(atual.reach, ant.reach),
    views: varia(atual.views, ant.views),
    inter: varia(atual.total_interactions, ant.total_interactions)
  };
}

/* variação de seguidores no período escolhido */
function deltaSeguidores() {
  const dl = (S.d && S.d.follower_deltas) || {};
  const chave = (S.periodo === "d1" || S.periodo === "d7") ? "d7" : "d28";
  const d = dl[chave];
  if (!d || !has(d.value)) return null;
  return { value: d.value, dias: d.dias, oficial: d.source === "official" };
}

function chipDelta(valor, sufixo = "") {
  if (!has(valor)) return "";
  const cls = Math.abs(valor) < 0.05 ? "flat" : valor > 0 ? "up" : "down";
  const sinal = valor > 0 ? "+" : "";
  const txt = sufixo === "%" ? `${sinal}${pct(valor)}` : `${sinal}${nf.format(Math.round(valor))}`;
  return `<span class="delta ${cls}">${ic(cls)}${txt}</span>`;
}

function audience(d) {
  const a = d.audience || {};
  const sum = arr => (arr || []).reduce((s, x) => s + (x.value || 0), 0);
  const gTot = sum(a.gender);
  const gName = l => l === "F" ? "Feminino" : l === "M" ? "Masculino" : "Não informado";
  const gender = (a.gender || []).map(g => ({ label: gName(g.label), key: g.label, value: g.value, share: gTot ? g.value / gTot * 100 : 0 }));

  const order = ["13-17", "18-24", "25-34", "35-44", "45-54", "55-64", "65+"];
  const ageRaw = (a.age || []).slice().sort((x, y) => order.indexOf(x.label) - order.indexOf(y.label));
  const aTot = sum(ageRaw);
  const age = ageRaw.map(x => ({ label: x.label.replace("-", "–"), raw: x.label, value: x.value, share: aTot ? x.value / aTot * 100 : 0 }));

  let pair = null;
  for (let i = 0; i < age.length - 1; i++) {
    const s = age[i].share + age[i + 1].share;
    const a0 = age[i].raw.split("-")[0], a1 = (age[i + 1].raw.split("-")[1] || "").replace("+", "");
    if (!pair || s > pair.share) pair = { share: s, label: `${a0}–${a1 || "+"}` };
  }
  const topAge = age.reduce((m, x) => !m || x.value > m.value ? x : m, null);

  const cities = a.city || [];
  const cTot = sum(cities);
  const states = {};
  cities.forEach(c => {
    const st = (c.region || "").split(",").slice(1).join(",").replace("(state)", "").trim() || "Outros";
    states[st] = (states[st] || 0) + c.value;
  });
  const stateList = Object.entries(states).map(([label, value]) => ({ label, value, share: cTot ? value / cTot * 100 : 0 })).sort((x, y) => y.value - x.value);
  const cityList = cities.map(c => ({ label: c.label, value: c.value, share: cTot ? c.value / cTot * 100 : 0 }));

  let dn = null; try { dn = new Intl.DisplayNames(["pt-BR"], { type: "region" }); } catch (e) {}
  const kTot = sum(a.country);
  const countries = (a.country || []).map(c => ({ label: (dn && /^[A-Z]{2}$/.test(c.label) ? dn.of(c.label) : c.label), value: c.value, share: kTot ? c.value / kTot * 100 : 0 }));

  const followers = d.profile?.followers || 0;
  return { gender, age, pair, topAge, stateList, cityList, countries, cTot, coverage: followers ? cTot / followers * 100 : null };
}

/* ======================================================================
   LEITURA DOS DADOS
   Cada frase é uma regra sobre um número real e só aparece quando aquele
   número existe. O enquadramento é positivo, mas a afirmação é literal:
   nada aqui extrapola o que o dado sustenta.
   ====================================================================== */
function leitura(K, A) {
  const out = [];

  if (has(K.reach) && K.followers) {
    const r = K.reach / K.followers;
    out.push(r >= 1
      ? { ic: "reach", t: `Alcance ${dec(r)}× maior que a base`, p: `Nos ${K.dias === 1 ? "últimos 1 dia" : `últimos ${K.dias} dias`}, o conteúdo chegou a ${fmt(K.reach)} contas — mais do que o total de ${fmt(K.followers)} seguidores. Boa parte de quem vê ainda não segue, o que significa público novo a cada campanha.` }
      : { ic: "reach", t: `${pct(r * 100, 0)} da base alcançada no período`, p: `${fmt(K.reach)} contas únicas viram o conteúdo nos últimos ${K.dias} dias.` });
  }

  if (has(K.freq) && K.freq >= 1.2) {
    out.push({ ic: "eye", t: `Cada pessoa vê ${dec(K.freq)}× em média`, p: `São ${fmt(K.views)} visualizações para ${fmt(K.reach)} contas alcançadas. A mensagem da marca não passa uma vez só — ela se repete naturalmente para a mesma pessoa.` });
  }

  if (has(K.shares) && K.reach && K.shares > 0) {
    const taxa = K.shares / K.reach * 100;
    out.push({ ic: "send", t: `${fmt(K.shares)} compartilhamentos no período`, p: `${pct(taxa)} de quem foi alcançado repassou o conteúdo para alguém. Compartilhamento é o sinal mais forte de que a mensagem viaja além do próprio público.` });
  }

  if (has(K.saves) && K.saves > 0) {
    out.push({ ic: "save", t: `${fmt(K.saves)} salvamentos`, p: `Conteúdo salvo é conteúdo guardado para depois — indica que a audiência trata a recomendação como referência, não como entretenimento passageiro.` });
  }

  const g1 = A.gender.find(g => g.key === "F");
  if (g1 && g1.share >= 50 && A.pair) {
    out.push({ ic: "users", t: `${pct(g1.share, 0)} mulheres, concentradas entre ${A.pair.label} anos`, p: `Perfil de audiência bem definido — quanto mais homogêneo o público, mais previsível o resultado de uma campanha dirigida a ele.` });
  }

  const top = A.stateList[0];
  if (top && top.share >= 35) {
    const cidade = A.cityList[0];
    out.push({ ic: "pin", t: `${pct(top.share, 0)} da base mapeada em ${top.label}`, p: cidade ? `Com ${pct(cidade.share, 0)} só na cidade de ${cidade.label}. Essa concentração permite ação regional, evento presencial ou campanha com foco geográfico.` : `Concentração que permite ação regional ou campanha com foco geográfico.` });
  }

  const br = A.countries.find(c => /brasil/i.test(c.label));
  if (br && br.share >= 90) {
    out.push({ ic: "globe", t: `${pct(br.share, 0)} da audiência no Brasil`, p: `Público praticamente todo nacional — sem desperdício de alcance para fora do mercado da marca.` });
  }

  const C = comparativo();
  if (C && has(C.reach) && C.reach > 5) {
    out.push({ ic: "bolt", t: `Alcance ${pct(C.reach, 0)} acima do período anterior`, p: `Comparando os últimos 28 dias com os 28 dias anteriores. Momento de crescimento costuma ser a melhor janela para entrar com uma campanha.` });
  }

  const melhor = (S.media || []).reduce((m, x) => (!m || (x.views || 0) > (m.views || 0)) ? x : m, null);
  if (melhor && has(melhor.views) && melhor.views >= 100000) {
    out.push({ ic: "spark", t: `Maior conteúdo: ${fmt(melhor.views)} visualizações`, p: `Um único Reel com esse desempenho mostra o teto de alcance do perfil quando o conteúdo encaixa no algoritmo.` });
  }

  return out.slice(0, 6);
}

/* ---------- gráfico ---------- */
function renderPerf() {
  const d = S.d, conf = SERIES[S.metric];
  const pts = (d.series || []).map(s => ({ date: s.date, v: conf.get(s) })).filter(x => has(x.v));
  const last = pts[pts.length - 1], firstP = pts[0];
  const current = S.metric === "followers" ? (d.profile?.followers ?? last?.v) : last?.v;

  let trend = "";
  if (pts.length >= 2 && firstP.v) {
    const ch = (last.v - firstP.v) / Math.abs(firstP.v) * 100;
    const abs = S.metric === "followers" ? ` (${last.v - firstP.v >= 0 ? "+" : ""}${nf.format(last.v - firstP.v)})` : "";
    trend = `${chipDelta(ch, "%")}<span>no período registrado${abs}</span>`;
  }

  const perLabel = pts.length ? `${pts.length} ${pts.length === 1 ? "dia registrado" : "dias registrados"} · ${dShort(firstP.date)}${pts.length > 1 ? " – " + dShort(last.date) : ""}` : "Sem registros ainda";
  const sub = S.metric === "followers" ? "Total atual" : S.metric === "engagement" ? "Último dia registrado · interações ÷ alcance" : "Último dia registrado";

  $("#perfBody").innerHTML = `
    <div class="perf-top">
      <div><div class="perf-value num">${fmtBy(conf.kind, current)}</div>
        <div class="perf-sub"><span>${sub}</span>${provTag(S.metric === "engagement" ? "calc" : "official")}</div></div>
      <div class="perf-sub">${trend}</div>
    </div>
    <div class="chart" id="chart"></div>
    <div class="perf-foot">
      <span>${ic("cal")}Período: ${perLabel}</span>
      ${d.last_sync ? `<span>${ic("clock")}Atualizado em ${dTime(d.last_sync)}</span>` : ""}
    </div>`;

  const el = $("#chart");
  if (pts.length < 2) {
    el.innerHTML = `<div class="collecting"><span class="pulse"></span><b>Histórico em construção</b>
      <p>${pts.length ? `O registro diário começou em ${dShort(pts[0].date)}.` : "O registro diário começa na próxima coleta."} A linha de tendência aparece a partir do segundo dia e ganha consistência com 7 dias ou mais. Os totais por período acima vêm direto da Meta e não dependem desse histórico.</p></div>`;
    return;
  }
  drawChart(el, pts, conf.kind);
}

function drawChart(el, pts, kind) {
  const W = el.clientWidth || 600, H = el.clientHeight || 240;
  const pad = { l: 46, r: 14, t: 14, b: 28 };
  const vals = pts.map(p => p.v);
  let mn = Math.min(...vals), mx = Math.max(...vals);
  if (mn === mx) { mn -= 1; mx += 1; }
  const span = mx - mn; mn -= span * 0.12; mx += span * 0.12;
  if (kind !== "pct" && mn < 0 && Math.min(...vals) >= 0) mn = 0;

  const x = i => pad.l + (W - pad.l - pad.r) * (pts.length === 1 ? .5 : i / (pts.length - 1));
  const y = v => pad.t + (H - pad.t - pad.b) * (1 - (v - mn) / (mx - mn));
  const xy = pts.map((p, i) => [x(i), y(p.v)]);

  let dPath = `M${xy[0][0].toFixed(1)},${xy[0][1].toFixed(1)}`;
  for (let i = 0; i < xy.length - 1; i++) {
    const p0 = xy[i - 1] || xy[i], p1 = xy[i], p2 = xy[i + 1], p3 = xy[i + 2] || p2;
    const c1 = [p1[0] + (p2[0] - p0[0]) / 6, p1[1] + (p2[1] - p0[1]) / 6];
    const c2 = [p2[0] - (p3[0] - p1[0]) / 6, p2[1] - (p3[1] - p1[1]) / 6];
    dPath += ` C${c1[0].toFixed(1)},${c1[1].toFixed(1)} ${c2[0].toFixed(1)},${c2[1].toFixed(1)} ${p2[0].toFixed(1)},${p2[1].toFixed(1)}`;
  }
  const area = `${dPath} L${xy[xy.length - 1][0].toFixed(1)},${H - pad.b} L${xy[0][0].toFixed(1)},${H - pad.b} Z`;
  const ticks = [mx - (mx - mn) * .12, (mx + mn) / 2, mn + (mx - mn) * .12];
  const short = v => kind === "pct" ? pct(v) : fmt(v);
  const xl = [0, Math.floor((pts.length - 1) / 2), pts.length - 1].filter((v, i, a) => a.indexOf(v) === i);

  el.innerHTML = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Gráfico de evolução">
    <defs><linearGradient id="ga" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6E4E36" stop-opacity=".18"/><stop offset="1" stop-color="#6E4E36" stop-opacity="0"/></linearGradient></defs>
    ${ticks.map(t => `<line class="grid-line" x1="${pad.l}" x2="${W - pad.r}" y1="${y(t).toFixed(1)}" y2="${y(t).toFixed(1)}"/><text class="axis" x="${pad.l - 10}" y="${(y(t) + 4).toFixed(1)}" text-anchor="end">${short(t)}</text>`).join("")}
    ${xl.map(i => `<text class="axis" x="${x(i).toFixed(1)}" y="${H - 6}" text-anchor="${i === 0 ? "start" : i === pts.length - 1 ? "end" : "middle"}">${dShort(pts[i].date)}</text>`).join("")}
    <path class="area" d="${area}" fill="url(#ga)"/>
    <path class="line" d="${dPath}" pathLength="1"/>
    <circle cx="${xy[xy.length - 1][0].toFixed(1)}" cy="${xy[xy.length - 1][1].toFixed(1)}" r="4.5" fill="#6E4E36" stroke="#fff" stroke-width="2"/>
    <line class="cursor" id="cur" y1="${pad.t}" y2="${H - pad.b}" x1="${xy[0][0]}" x2="${xy[0][0]}"/>
    <circle class="cur-dot" id="curDot" r="5" fill="#fff" stroke="#6E4E36" stroke-width="2" cx="${xy[0][0]}" cy="${xy[0][1]}"/>
    <rect x="${pad.l}" y="0" width="${W - pad.l - pad.r}" height="${H}" fill="transparent" id="hit"/>
  </svg><div class="chart-tip" id="tip"></div>`;

  const hit = $("#hit", el), tip = $("#tip", el), cur = $("#cur", el), dot = $("#curDot", el);
  const move = e => {
    const r = el.getBoundingClientRect(); const px = (e.clientX - r.left) * (W / r.width);
    let bi = 0, bd = 1e9; xy.forEach((p, i) => { const dd = Math.abs(p[0] - px); if (dd < bd) { bd = dd; bi = i; } });
    const [cx, cy] = xy[bi];
    cur.setAttribute("x1", cx); cur.setAttribute("x2", cx); dot.setAttribute("cx", cx); dot.setAttribute("cy", cy);
    tip.innerHTML = `<b>${short(pts[bi].v)}</b>${dShort(pts[bi].date)}`;
    tip.style.left = (cx / W * r.width) + "px"; tip.style.top = (cy / H * r.height) + "px"; tip.style.opacity = 1;
    el.classList.add("hover");
  };
  const leave = () => { tip.style.opacity = 0; el.classList.remove("hover"); };
  hit.addEventListener("pointermove", move); hit.addEventListener("pointerdown", move); hit.addEventListener("pointerleave", leave);
  if (el.closest(".reveal.in") || reduce) requestAnimationFrame(() => el.classList.add("drawn"));
  else el.dataset.pending = "1";
}

/* ---------- animação ---------- */
let io = null;
function countUp(el) {
  if (el.dataset.done) return; el.dataset.done = 1;
  const to = parseFloat(el.dataset.count); if (!has(to) || isNaN(to)) return;
  const kind = el.dataset.kind || "num";
  const show = v => el.textContent = kind === "pct" ? pct(v) : kind === "int" ? String(Math.round(v)) : fmt(v);
  if (reduce) return show(to);
  const dur = 1200, t0 = performance.now();
  const tick = t => { const k = Math.min(1, (t - t0) / dur); const e = 1 - Math.pow(1 - k, 4); show(to * e); if (k < 1) requestAnimationFrame(tick); else show(to); };
  requestAnimationFrame(tick);
}
function observe() {
  const onIn = el => {
    el.classList.add("in");
    $$("[data-count]", el).forEach(countUp);
    if (el.matches("[data-count]")) countUp(el);
    const ch = $(".chart[data-pending]", el); if (ch) { delete ch.dataset.pending; requestAnimationFrame(() => ch.classList.add("drawn")); }
    const dn = $(".js-donut", el); if (dn) $$("circle", dn).forEach(c => c.setAttribute("stroke-dasharray", `${c.style.getPropertyValue("--dash")} 999`));
  };
  if (!("IntersectionObserver" in window) || reduce) { $$(".reveal").forEach(onIn); return; }
  io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { onIn(e.target); io.unobserve(e.target); } }), { threshold: 0.12, rootMargin: "0px 0px -6% 0px" });
  $$(".reveal").forEach(el => io.observe(el));
  const spy = new IntersectionObserver(es => es.forEach(e => {
    if (e.isIntersecting) $$("#hdrNav a").forEach(a => a.classList.toggle("active", a.dataset.spy === e.target.id));
  }), { rootMargin: "-45% 0px -50% 0px" });
  $$("main section[id]").forEach(s => spy.observe(s));
}

  });

  $$(".seg button[data-periodo]").forEach(b => b.onclick = () => {
    S.periodo = b.dataset.periodo;
    $$(".seg button[data-periodo]").forEach(x => x.setAttribute("aria-selected", x === b));
    renderPeriodo();
    renderBento();
    renderReading();

  $$(".chip").forEach(b => b.onclick = () => {
    S.filter = b.dataset.filter; S.showAll = false;

  $("#app").addEventListener("click", e => {
    const post = e.target.closest(".post"); if (post) return openModal(+post.dataset.idx);
    if (e.target.closest("#showAll")) { S.showAll = true; renderFeed(true); track("content_show_all"); }
    if (e.target.closest("#pdfBtn3")) return baixarPDF();
    const t = e.target.closest("[data-track]"); if (t) track(t.dataset.track);
  }, { once: false });

  $$(".js-contact").forEach(a => { a.href = contactHref(); if (a.href.startsWith("http")) { a.target = "_blank"; a.rel = "noopener"; } });
  $$(".js-ig").forEach(a => a.href = igHref());

  let rt; addEventListener("resize", () => {
    clearTimeout(rt);
    rt = setTimeout(() => { const ch = $("#chart"); if (ch && !ch.querySelector(".collecting")) { renderPerf(); requestAnimationFrame(() => $("#chart")?.classList.add("drawn")); } }, 200);
  });
}

/* header / menu / modal */
const hdr = $("#hdr"), menuBtn = $("#menuBtn"), sheet = $("#sheet");
const onScroll = () => hdr.classList.toggle("scrolled", scrollY > 8);
addEventListener("scroll", onScroll, { passive: true }); onScroll();

function setMenu(open) {
  sheet.classList.toggle("open", open); sheet.setAttribute("aria-hidden", !open);
  menuBtn.setAttribute("aria-expanded", open); menuBtn.setAttribute("aria-label", open ? "Fechar menu" : "Abrir menu");
  hdr.classList.toggle("menu-open", open); document.documentElement.classList.toggle("lock", open);
}
menuBtn.onclick = () => setMenu(!sheet.classList.contains("open"));
sheet.addEventListener("click", e => { if (e.target.closest("a")) setMenu(false); });
$("#pdfBtn").onclick = baixarPDF;
$("#pdfBtn2").onclick = () => { setMenu(false); baixarPDF(); };

$("#modal").addEventListener("click", e => {
  if (e.target.closest("[data-close]")) closeModal();
  const s = e.target.closest("[data-step]"); if (s) step(+s.dataset.step);
});
addEventListener("keydown", e => {
  const open = $("#modal").classList.contains("open");
  if (e.key === "Escape") { if (open) closeModal(); else if (sheet.classList.contains("open")) setMenu(false); }
  if (open && e.key === "ArrowRight") step(1);
  if (open && e.key === "ArrowLeft") step(-1);
});
matchMedia("(min-width:960px)").addEventListener("change", e => { if (e.matches) setMenu(false); });

/* analytics leve */
function beacon(path, body) { try { navigator.sendBeacon(SITE.API_BASE + path, JSON.stringify(body)); } catch (e) {} }
function track(event, detail) { beacon("/api/event", { session_id: S.sid, event, detail }); }
(function visit() {
  const t0 = Date.now(); let maxS = 0;
  addEventListener("scroll", () => { const p = Math.round((scrollY + innerHeight) / document.body.scrollHeight * 100); if (p > maxS) maxS = p; }, { passive: true });
  const send = dur => beacon("/api/track", { session_id: S.sid, path: location.pathname, referrer: document.referrer, utm_source: new URLSearchParams(location.search).get("utm_source"), duration_sec: dur, max_scroll_pct: maxS });
  send(0);
  addEventListener("pagehide", () => send(Math.round((Date.now() - t0) / 1000)));
})();

/* carga */
function load() {
  fetch(SITE.API_BASE + "/api/kit", { cache: "no-store" })
    .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
    .then(render)
    .catch(() => {
      $("#app").innerHTML = `<div class="err"><b>Não foi possível carregar os dados</b><p>A conexão com o servidor falhou. Tente novamente em instantes.</p><button class="btn btn-primary" onclick="load()">Tentar novamente</button></div>`;
    });
}
load();
</script>
